# Next.js trên Netlify cần plugin để phục vụ App Router.
# Không ghi số phiên bản ở đây để Netlify cài bản adapter mới khi build.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# www về đúng tên miền chính. HTTP lên HTTPS do Netlify xử lý trước (301).
[[redirects]]
  from = "/*"
  to = "https://ontoan.vn/:splat"
  status = 301
  force = true

  [redirects.conditions]
    Host = ["www.ontoan.vn"]
